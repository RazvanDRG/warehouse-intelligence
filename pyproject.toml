[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-intelligence"
version = "0.1.0"
description = "AI system that attaches to the Warehouse Operations Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["api*", "core*", "adapters*", "pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
# Kit copy, replaced on kit updates.
extend-exclude = ["tools/boundary_check.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
