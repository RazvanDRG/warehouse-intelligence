name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Throwaway database that lives only for this run (D-017).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wi -d wi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wi:ci-only-password@localhost:5432/wi_test
      - run: python tools/boundary_check.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t warehouse-intelligence:ci .
